</head>

                <a href="skills.html" class="block text-red-600 w-full text-center py-3 border-b border-red-900/30 hover:bg-red-950/30">Skills</a>
                <a href="projects.html" class="block text-red-600 w-full text-center py-3 border-b border-red-900/30 hover:bg-red-950/30">Projects</a>
                <a href="contact.html" class="block text-red-600 w-full text-center py-3 border-b border-red-900/30 hover:bg-red-950/30">Contact</a>
                <a href="about.html" class="block text-red-600 w-full text-center pt-3 hover:bg-red-950/30">About</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-16 min-h-screen flex items-center page-fade-in">
        <div class="container mx-auto px-4">
            <h1 class="text-4xl font-bold text-center gradient-text mb-12">Get in Touch</h1>

            <div class="max-w-2xl mx-auto">
                <!-- Contact Form -->
                <div class="bg-[#2a0a0a]/40 backdrop-blur-md p-8 rounded-2xl shadow-xl border border-amber-500/20">
                    <form id="contact-form" class="space-y-6">
                        <div>
                            <label class="block text-amber-100 mb-2" for="name">Name <span class="text-red-500">*</span></label>
                            <input type="text" id="name" required
                                   class="w-full px-4 py-3 bg-red-950/50 border border-amber-500/30 rounded-lg 
                                          focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 
                                          transition-all text-white placeholder-red-300/50"
                                   placeholder="Enter your name">
                        </div>
                        <div>
                            <label class="block text-amber-100 mb-2" for="email">Email <span class="text-red-500">*</span></label>
                            <input type="email" id="email" required
                                   class="w-full px-4 py-3 bg-red-950/50 border border-amber-500/30 rounded-lg 
                                          focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 
                                          transition-all text-white placeholder-red-300/50"
                                   placeholder="Enter your email">
                        </div>
                        <div>
                            <label class="block text-amber-100 mb-2" for="message">Message <span class="text-red-500">*</span></label>
                            <textarea id="message" rows="6" required
                                      class="w-full px-4 py-3 bg-red-950/50 border border-amber-500/30 rounded-lg 
                                             focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 
                                             transition-all text-white placeholder-red-300/50 resize-none"
                                      placeholder="Enter your message (minimum 10 characters)"></textarea>
                        </div>
                        <button type="submit" 
                                class="w-full bg-gradient-to-r from-red-600 to-rose-500 text-white py-3 rounded-lg 
                                       font-semibold hover:from-red-700 hover:to-rose-600 transition-all duration-300 
                                       transform hover:scale-[1.02] border border-amber-500/30">
                            Send Message
                        </button>
                    </form>

                    <!-- Social Links -->
                    <div class="mt-8 flex justify-center space-x-6">
                        <a href="https://github.com/srfie714692358" target="_blank" class="text-red-600 hover:text-amber-500 transition-colors duration-300 text-2xl">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://linkedin.com/in/sajjad-rafiee-91294a246" target="_blank" class="text-red-600 hover:text-amber-500 transition-colors duration-300 text-2xl">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://www.instagram.com/srafie2004/" target="_blank" class="text-red-600 hover:text-amber-500 transition-colors duration-300 text-2xl">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://t.me/SajjadRafieeTabriz" target="_blank" class="text-red-600 hover:text-amber-500 transition-colors duration-300 text-2xl">
                            <i class="fab fa-telegram"></i>
                        </a>
                        <a href="https://x.com/Sajjad61837849" target="_blank" class="text-red-600 hover:text-amber-500 transition-colors duration-300 text-2xl">
                            <i class="fab fa-x-twitter"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer with gold border -->
    <footer class="bg-[#1a0505] gold-border text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm md:text-base">© 2024 Sajjad Rafiee. All rights reserved.</p>
        </div>
